name: CaveStock checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cavestock
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: cavestock_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cavestock -d cavestock_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://cavestock:local-ci-only@localhost:5432/cavestock_test
      DIRECT_URL: postgresql://cavestock:local-ci-only@localhost:5432/cavestock_test
      AUTH_SECRET: ci-only-secret-not-used-outside-automated-tests
      BREVO_API_KEY: local-test-no-real-key
      BREVO_SENDER_EMAIL: test@example.invalid
      CAVESTOCK_CONTACT_EMAIL: contact@example.invalid
      CAVESTOCK_SITE_URL: https://example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:deploy
      - run: npm run build
      - run: npm run test:password -- --regression
